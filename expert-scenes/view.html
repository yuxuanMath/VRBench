<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expert trajectory</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eff3f7;font:13px system-ui;color:#384453}canvas{width:100%;height:100%;display:block;touch-action:none}#viewport{position:absolute;inset:0 0 65px}footer{position:absolute;bottom:74px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}footer span,button{border:0;border-radius:20px;background:#fffffff2;padding:7px 10px;font:inherit;color:inherit}button{pointer-events:auto;cursor:pointer}#status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:white;border-radius:6px;padding:8px;text-align:center}
.sliders{position:absolute;bottom:0;left:0;right:0;height:65px;display:grid;grid-template-columns:1fr 1.45fr;gap:18px;align-items:center;padding:0 14px;background:white;border-top:1px solid #dfe6ec}.sliders label{display:grid;gap:4px;min-width:0}.sliders input{width:100%;margin:0;accent-color:#145bc1}.sliders output{float:right;font-size:11px;font-variant-numeric:tabular-nums}.sliders span{white-space:nowrap}@media(max-width:380px){.sliders{gap:9px;padding:0 7px;font-size:11px}}
</style></head><body><div id="viewport" tabindex="0" aria-label="Interactive expert trajectory. Arrow keys to orbit, plus and minus to zoom."></div><div id="status" role="status">Loading scene…</div><footer><span>Drag to orbit · Scroll or pinch to zoom</span><button type="button" id="reset">Reset view</button></footer>
<div class="sliders"><label><span>Scene opacity <output id="opacity-value">30%</output></span><input id="opacity" type="range" min="0" max="100" value="30" disabled></label><label><span>Expert replay <output id="frame-value"></output></span><input id="frame" type="range" min="0" max="0" value="0" disabled></label></div>
<script src="lib/three.min.js"></script><script src="lib/OrbitControls.js"></script><script type="module" src="viewer.js"></script></body></html>
